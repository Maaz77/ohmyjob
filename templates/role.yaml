# <Role>.yaml: one resume per target role. Merged with base.yaml when the PDF is built (`ohmyjob resume build`).
# Only plain text and **bold** reach the PDF: bold works in the introduction, bullets and skill items; everything else
# (backslashes, braces, other symbols) prints literally. Never put LaTeX, links or markdown here.
title: Role Title
introduction: >-
  Two sentences about what you do and what you deliver, in plain words.
experience:
  # A plain entry:
  - role: Job Title
    company: Company Name
    location: City, Country
    dates: 2020 - Present
    bullets:
      - Achievement with a number, written in one or two lines (at most 248 characters).
      - Another achievement, with the **key term** in bold.
  # An employer with several roles (one row each, the employer printed once):
  - employer: Another Company
    location: City, Country
    dates: 2016 - 2020
    roles:
      - role: Senior Job Title
        dates: 2018 - 2020
        bullets:
          - Achievement in the later role.
      - role: Job Title
        dates: 2016 - 2018
        bullets:
          - Achievement in the earlier role.
projects: []                # or: - {title: Name, repo: https://example.com/name, bullets: [What it does]}
skills:                     # one row each, label plus items (at most 106 characters per row)
  - label: Group one
    items: Skill, skill, skill
  - label: Group two
    items: Skill, skill
interests: no               # yes prints the interests text of base.yaml
education_details: no       # yes prints the education details of base.yaml
