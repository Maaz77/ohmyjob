# OHMYJOB-TEMPLATE: copy this file to <Field>.yaml, replace the mock data, then delete this line
#
# One complete CV (the layout of Awesome-CV's examples/cv.tex): it has no page limit. Copy it to a file named after
# the field it targets (Data-Analyst-CV.yaml ...), replace every mock value with your own, and build it with
# /ohmyjob:build-resumes. Keep the keys; delete a whole optional key (marked "optional") when you do not need it. A
# section without entries is left out. The PDF is built next to the file with the same name.
# For the one-page resume layout start from Template.yaml instead.
#
# Text rules: plain text, plus **double stars** for bold (use it for a few key terms). Anything else prints as you type
# it: no LaTeX, no markdown links. Quote a value ("...") when it contains a colon or starts with a symbol, such as
# a phone number starting with +. Keep every bullet to ONE line (about 124 characters).

# resume or cv. A key the chosen document does not show (introduction in a CV ...) is ignored and the build prints a
# WARNING line. The CV prints these sections in this order: Education, Skills, Experience, Extracurricular Activity,
# Honors & Awards, Certificates, Presentation, Writing, Program Committees.
document: cv

# Your name, as printed in the large header.
name:
  first: Alex
  last: Example

# The role you apply for: printed under your name, and used by the job screening to match jobs to this CV.
title: Operations Analyst

# Header contact lines.
address: Musterstrasse 12, 10115 Berlin, Germany
phone: "+49 30 23125 042"
email: alex.example@example.com
# optional: web address. A bare "example.com/alex" gets https:// added. Only http(s) links are allowed.
homepage: example.com/alex
# optional: your user name on GitHub and on LinkedIn (the part after github.com/ and linkedin.com/in/), not the full link.
github: alex-example-fixture
linkedin: alex-example-fixture
# optional: a short quote printed under the header.
quote: Be the change that you want to see in the world.
# optional: one more short text for the header line, for example "Work permit: EU citizen".
# extra: EU citizen
# optional: a photo file (jpg, png or pdf) in this same folder; printed as a round picture in the header.
# photo: photo.jpg
# optional: a date of birth, printed in the header as written.
# date_of_birth: 1 January 1990
# optional: the accent colour of headings and the role title, one of Awesome-CV's colours: emerald, skyblue, red, pink,
# orange, nephritis, concrete, darknight. Default: red.
# accent_color: red

# optional: rename the section headings. Keys: education, skills, experience, extracurricular, honors, certificates,
# presentation, writing, committees.
# sections:
#   experience: Work Experience

# Education. details: extra lines under the degree (thesis, grade ...), printed only when education_details is yes.
education:
  - degree: BSc Business Administration
    school: Rhein-Spree University of Applied Sciences
    location: Berlin, Germany
    dates: 2014 - 2018
    details:
      - "Thesis: forecast error in regional parcel networks"
      - Final grade 1.8 (German scale)
# yes: print the details lines above. no: print only degree, school, place and dates.
education_details: yes

# Skills, one row each: a short label and a comma separated list (one line per row, about 109 characters).
skills:
  - label: Analysis
    items: Excel, SQL, Power BI, forecasting, KPI design
  - label: Operations
    items: Route planning, carrier management, invoice reconciliation, Lean basics
  - label: Tools
    items: Python (pandas), Excel macros, Jira
  - label: Languages
    items: German, English

# Experience, newest first. Each entry is one of two shapes.
experience:
  # Shape 1: one employer with several roles (the employer is printed once, one row per role).
  - employer: Harborline Freight Group
    location: Hamburg, Germany
    dates: 2020 - Present
    roles:
      - role: Senior Operations Analyst
        dates: 2022 - Present
        bullets:
          - Built a weekly **dock utilisation** report in SQL and Power BI that cut truck waiting time by 18% across 6 depots.
          - Led 3 analysts in moving daily route planning from spreadsheets to a shared **forecasting model**.
          - Presented monthly cost-per-parcel reviews to the regional operations director.
      - role: Operations Analyst
        dates: 2020 - 2022
        bullets:
          - Reconciled carrier invoices against shipment data and recovered EUR 140k in billing errors over two years.
          - Automated the Monday KPI pack with Excel macros and Python, saving about 6 hours a week.
  # Shape 2: one role at one employer. bullets: one achievement per line, with numbers where you have them.
  - role: Supply Planning Analyst
    company: Brightwater Foods
    location: Berlin, Germany
    dates: 2018 - 2020
    bullets:
      - Forecast demand for 400 chilled products and raised forecast accuracy from 71% to 83%.
      - Worked with buyers on promotion calendars and cut write-offs of short-life products by 12%.

# Extracurricular Activity (optional): role, title (the organisation), location, date, items (bullets).
extracurricular:
  - role: Volunteer
    title: Example Food Bank
    location: Berlin, Germany
    date: 2019 - Present
    items:
      - Plans the weekly pick-up routes for 12 volunteer drivers.

# Honors & Awards (optional): award, event, location, date.
honors:
  - award: 2nd Place
    event: Rhein-Spree Logistics Case Competition
    location: Berlin, Germany
    date: 2017

# Certificates (optional): award = the certificate, event = the issuer, location = the credential id (may be empty), date.
certificates:
  - award: Certified Supply Chain Analyst
    event: Example Supply Chain Institute
    location: ""
    date: 2021

# Presentation (optional): role (the talk), title (the event), location, date, items (bullets).
presentation:
  - role: Speaker for "Forecasting chilled demand"
    title: Example Logistics Forum
    location: Hamburg, Germany
    date: Nov. 2022
    items:
      - Showed how a simple forecasting model cut write-offs in grocery supply chains.

# Writing (optional): role, title (the publication), location, date, items (bullets).
writing:
  - role: Contributing Author
    title: Example Logistics Review
    location: Online
    date: 2021 - 2022
    items:
      - Wrote four articles about KPI design for warehouse teams.

# Program Committees (optional): award = your position, event = the committee, location, date.
committees:
  - award: Reviewer
    event: Example Logistics Forum 2023
    location: Hamburg, Germany
    date: 2023
