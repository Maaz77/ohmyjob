# base.yaml: the fixed facts of your resume (header, education, headings). Setup and /ohmyjob:profile write this file
# from your resume; edit it by hand when something changes. The pipeline never modifies it. Every role file
# (<Role>.yaml) is merged on top of it when a PDF is built.
name:
  first: Firstname
  last: Lastname
address: Street 1, 00000 City, Country
phone: "+00 000 0000000"
email: name@example.com
# Optional header items. Delete the lines you do not use.
homepage: example.com/name
github: your-github-handle
linkedin: your-linkedin-handle
# extra: any short text for the header line
# photo: photo.jpg           # jpg, png or pdf, next to this file
# date_of_birth: 1 Jan 1990
# accent_color: "#0395DE"    # hex, or one of: emerald skyblue red pink orange nephritis concrete darknight
education:
  - degree: Degree, Subject
    school: University name
    location: City, Country
    dates: 2012 - 2016
    details:                 # printed only when a role file says `education_details: yes`
      - Thesis or final grade
interests: Interest one, interest two   # printed only when a role file says `interests: yes`
# Section headings. Defaults: Summary, Experience, Projects, Education, Skills, Interests.
sections:
  summary: Summary
  experience: Experience
  projects: Projects
  education: Education
  skills: Skills
