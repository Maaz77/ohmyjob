name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  PLAYWRIGHT_VERSION: "1.49.1"

jobs:
  validate:
    name: Plugin validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.1.0
        with:
          node-version: "22"
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.316
      - name: Validate the plugin
        run: claude plugin validate --strict .

  tests:
    name: Tests and PII gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: astral-sh/setup-uv@v5.4.1
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Run the tests
        run: uv run --frozen pytest -q tests

  pii-gate:
    name: PII gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: PII gate
        env:
          PII_TERMS: ${{ secrets.PII_TERMS }}
        run: |
          if [ -z "$PII_TERMS" ]; then
            echo "::notice::PII_TERMS secret is empty (a fork?); the PII gate is skipped."
            exit 0
          fi
          terms="$(mktemp "${RUNNER_TEMP}/pii-terms.XXXXXX")"
          out="$(mktemp "${RUNNER_TEMP}/pii-out.XXXXXX")"
          trap 'rm -f "$terms" "$out"' EXIT
          printf '%s\n' "$PII_TERMS" > "$terms"
          # Never print the gate's output: a hit line or even a file name can hold a personal term.
          if bash scripts/pii_gate.sh "$terms" > "$out" 2>&1; then
            echo "PII gate: clean"
          else
            echo "PII gate: $(wc -l < "$out" | tr -d ' ') hits, run scripts/pii_gate.sh locally"
            exit 1
          fi

  resume-build:
    name: TinyTeX resume build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: astral-sh/setup-uv@v5.4.1
      - name: Install poppler
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Install TinyTeX
        run: |
          curl -fsSL https://yihui.org/tinytex/install-bin-unix.sh | sh
          bin="$(dirname "$(find "$HOME/.TinyTeX/bin" -name tlmgr | head -n 1)")"
          echo "$bin" >> "$GITHUB_PATH"
      - name: Install the LaTeX packages
        run: |
          tlmgr update --self
          tlmgr install $(grep -v '^[[:space:]]*#' scripts/tex-packages.txt | tr -s '[:space:]' ' ')
      - name: Build the sample resumes and run bootstrap with this LaTeX
        run: |
          set -o pipefail
          export OHMYJOB_LUALATEX="$(command -v lualatex)"
          test -x "$OHMYJOB_LUALATEX"
          uv run --frozen pytest -q -rs tests/test_resume_build.py tests/test_bootstrap.py | tee pytest.out
          # a skipped test would leave this job green with nothing run
          if grep -q SKIPPED pytest.out; then echo "a test was skipped"; exit 1; fi

  extension:
    name: Extension tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: astral-sh/setup-uv@v5.4.1
      - name: Install Playwright and Chromium (this job only)
        run: uv run --frozen --with "playwright==${PLAYWRIGHT_VERSION}" python -m playwright install --with-deps chromium
      - name: Run the extension tests
        run: |
          set -o pipefail
          uv run --frozen --with "playwright==${PLAYWRIGHT_VERSION}" pytest -q -rs tests/apply/test_extension.py | tee pytest.out
          # a skipped test would leave this job green with nothing run
          if grep -q SKIPPED pytest.out; then echo "a test was skipped"; exit 1; fi
