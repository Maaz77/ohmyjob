<p>(k) hidden fields:
<input id="k1" type="text" aria-label="Website" style="display:none">
<input id="k2" type="text" aria-label="Vis Hidden" style="visibility:hidden">

<input id="k4" type="hidden" name="hp" value="x"></p>
<pre id="log"></pre><script src="common.js"></script>
<script>
// (a) React-style value tracker
(function(){var el=document.getElementById('ta');var proto=Object.getOwnPropertyDescriptor(HTMLInputElement.prototype,'value');var tracked='';
Object.defineProperty(el,'value',{get:function(){return proto.get.call(el)},set:function(v){tracked=''+v;proto.set.call(el,v)},configurable:true});
el.addEventListener('input',function(){var real=proto.get.call(el);if(real!==tracked){tracked=real;log('(a) framework saw change: '+real)}else log('(a) framework MISSED change: '+real)});})();
// (b)
['focus','keydown','input','change','blur'].forEach(function(t){document.getElementById('tb').addEventListener(t,function(e){log('(b) '+t+(t=='keydown'?' '+e.key:'')+' value='+e.target.value)})});
// (c)
['input','focus','blur'].forEach(function(t){document.getElementById('tc').addEventListener(t,function(e){log('(c) '+t+': '+e.target.innerText)})});
// (d)
['input','change'].forEach(function(t){document.getElementById('td').addEventListener(t,function(e){log('(d) '+t+': '+e.target.value)})});
// (e)
['input','change'].forEach(function(t){document.getElementById('te').addEventListener(t,function(e){log('(e) '+t+': '+e.target.value)})});
// (f)
var tf=document.getElementById('tf'),lst=document.getElementById('lst');
tf.addEventListener('click',function(){lst.classList.add('open');tf.setAttribute('aria-expanded','true');log('(f) list opened')});
tf.addEventListener('input',function(){log('(f) input event: '+tf.value)});
tf.addEventListener('change',function(){log('(f) change event: '+tf.value)});
lst.querySelectorAll('.opt').forEach(function(o){o.addEventListener('click',function(){tf.value=o.textContent;lst.classList.remove('open');tf.setAttribute('aria-expanded','false');log('(f) committed '+o.textContent)})});
// (g)
document.getElementById('ag').addEventListener('change',function(e){log('(g) change checked='+e.target.checked)});
document.getElementById('ag').addEventListener('click',function(e){log('(g) click on real input')});
document.getElementById('aglab').addEventListener('click',function(e){log('(g) label click target='+(e.target.id||e.target.tagName))});
// (h)
var th=document.getElementById('th');th.addEventListener('click',function(){var v=th.getAttribute('aria-checked')!=='true';th.setAttribute('aria-checked',v);log('(h) toggled '+v)});
// (i)(j)
['input','change'].forEach(function(t){document.getElementById('ti').addEventListener(t,function(e){log('(i) '+t+': '+e.target.value)});document.getElementById('tj').addEventListener(t,function(e){log('(j) '+t+': '+e.target.value)})});
// (k)
['k1','k2','k3'].forEach(function(id){var e=document.getElementById(id);['input','change'].forEach(function(t){e.addEventListener(t,function(){log('(k) '+id+' '+t+': '+e.value)})})});
</script></body></html>
